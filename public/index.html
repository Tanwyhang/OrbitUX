    <script>
        (function () {
            console.log("OrbitUX: Navigation script initialized (v3 - Glassy Button)");

            function attachListener() {
                // The "Launch Orbit" button is likely the "Glassy Button" or contains the text
                var targets = [];

                // 1. Try "Glassy Button" (most likely based on HTML inspection)
                var glassyBtn = document.querySelector('[data-framer-name="Glassy Button"]');
                if (glassyBtn) targets.push({ name: "Glassy Button", el: glassyBtn });

                // 2. Try finding by text content "Launch Orbit"
                var allMarks = document.querySelectorAll('.framer-text');
                allMarks.forEach(function (mark) {
                    if (mark.innerText && mark.innerText.trim() === "Launch Orbit") {
                        // Walk up to find the clickable container (likely the <a> tag)
                        var container = mark.closest('a') || mark.closest('[data-framer-name="Glassy Button"]') || mark;
                        // Avoid duplicates
                        if (!targets.some(t => t.el === container)) {
                            targets.push({ name: "Text 'Launch Orbit'", el: container });
                        }
                    }
                });

                if (targets.length === 0) {
                    // Debug: log available buttons occasionally
                    if (Math.random() < 0.05) {
                        console.log("OrbitUX: No buttons found yet");
                    }
                    return;
                }

                targets.forEach(function (target) {
                    var btn = target.el;

                    // Check if we already attached to this specific element instance
                    if (btn.dataset.orbitAttached) return;

                    console.log("OrbitUX: Attached listener to", target.name, btn);

                    btn.dataset.orbitAttached = "true";
                    btn.style.cursor = 'pointer';
                    btn.style.pointerEvents = "auto";

                    // Add click listener
                    btn.addEventListener('click', function (e) {
                        console.log("OrbitUX: CLICKED on", target.name);
                        e.preventDefault();
                        e.stopPropagation();
                        window.parent.postMessage({ type: 'NAVIGATE_TO_MAIN' }, '*');
                    }, true);
                });
            }

            // Check periodically
            setInterval(attachListener, 1000);

            // Also check on load
            window.addEventListener('load', attachListener);
            document.addEventListener('DOMContentLoaded', attachListener);
        })();
    </script>
